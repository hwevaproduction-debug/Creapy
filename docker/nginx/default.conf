# Production-ready nginx config (no TLS here). Add TLS in a separate change in server block or via a separate server { listen 443 ssl; ... }

upstream backend {
    server backend:5000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads
    client_max_body_size 50m;

    # Deny access to hidden files under uploads early
    location ~ ^/uploads/\.
    {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve uploaded files from the shared docker volume
    location /uploads/ {
        alias /srv/uploads/;
        autoindex off;
        sendfile on;
        # Security headers for served files
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }

    # Static asset caching — proxy to frontend but set long cache headers for immutable assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_buffering off;
    }

    # Proxy API requests to backend service
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
    }

    # Proxy all other requests to frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering to stream responses immediately (useful for dev and some SSR setups)
        proxy_buffering off;

        # Allow gzip from upstream
        gzip on;
        gzip_proxied any;
    }

    # Uncomment and configure TLS in a separate change:
    # server {
    #   listen 443 ssl;
    #   ssl_certificate /etc/ssl/certs/your.crt;
    #   ssl_certificate_key /etc/ssl/private/your.key;
    #   include /etc/nginx/snippets/ssl-params.conf;
    # }
}
