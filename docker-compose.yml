version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: creapy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # Primary DB connection for Prisma / backend. Do NOT commit secrets; replace placeholders in env or .env files.
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/creapy?schema=public"
      # Application secrets & env placeholders — set these in your local env or docker-compose.override.yml
      JWT_SECRET: "${JWT_SECRET:-changeme}"
      COOKIE_SECRET: "${COOKIE_SECRET:-changeme}"
      # Add other placeholders as needed, e.g. EMAIL_API_KEY, S3_* etc.
      # Local MinIO / S3 defaults (override via .env or environment in production)
      S3_BUCKET: "${S3_BUCKET:-creapy-uploads}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-minioadmin}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_PUBLIC_BASE_URL: "${S3_PUBLIC_BASE_URL:-http://localhost:9000/creapy-uploads}"
    volumes:
      - uploads:/srv/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    # Frontend is internal-only; nginx will expose port 80
    # ports removed to make service internal-only
    # Optional: if you want frontend to wait for backend at runtime, add depends_on below
    # depends_on:
    #   - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 --tries=1 http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional Redis service. Disabled by default. To enable, remove the leading '#' from the lines below
  # and consider setting REDIS_URL in backend environment to redis://redis:6379
  #redis:
  #  image: redis:7
  #  restart: unless-stopped
  #  # Marked optional: use for caching, sessions, or rate-limiting

volumes:
  pgdata:
  uploads:
  minio_data:
